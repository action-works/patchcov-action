name: 'Patchcov Coverage Check'
description: 'Run code-coverage analysis and post a diff/patch-coverage PR comment using patchcov'
author: 'rust-works'

branding:
  icon: 'umbrella'
  color: 'blue'

inputs:
  # ---------------------------------------------------------------------------
  # patchcov install + cache
  # ---------------------------------------------------------------------------
  version:
    description: 'patchcov version to install: a release number with or without a leading v or V (e.g., 0.4.0 or v0.4.0), or latest. An empty value, only a v or V, or a value with a character a release number is not written with (a newline, a /, a quote) fails the step'
    required: false
    default: '0.4.0'
  github-token:
    description: 'Token used to authenticate GitHub API calls when resolving `version: latest`. Authenticated requests use the 1000/hr rate limit instead of the 60/hr unauthenticated, shared-runner-IP limit that intermittently fails resolution. Defaults to the workflow token'
    required: false
    default: ${{ github.token }}
  use-prebuilt-binary:
    description: 'Download pre-built binary from GitHub releases instead of building from source via cargo install'
    required: false
    default: 'true'
  cache-prefix:
    description: 'Prefix to prepend to the cache key for the patchcov binary'
    required: false
    default: ''

  # ---------------------------------------------------------------------------
  # Coverage run (fat mode). Set run-coverage: false to supply your own lcov.
  # ---------------------------------------------------------------------------
  run-coverage:
    description: 'Run cargo-llvm-cov to produce the head report. Set false (thin mode) to supply a pre-built report via the `report` input'
    required: false
    default: 'true'
  report:
    description: 'Path to the per-line head coverage report (lcov). Produced by the action in fat mode; must already exist in thin mode. With `shard-reports` it is instead where the combined report is written'
    required: false
    default: 'coverage-head.lcov'
  shard-reports:
    description: 'Thin mode only. Per-shard lcov reports (paths or globs, one per line) from a coverage run split across jobs. They are combined into `report` after each is checked: a missing, empty, or wrongly-rooted shard is named, so a failed shard cannot silently lower coverage. Everything downstream (comment, baseline, line gate) then reads that one file. Requires `run-coverage: false`'
    required: false
    default: ''
  test-args:
    description: 'Arguments passed to `cargo test`/`cargo llvm-cov` under instrumentation (fat mode). Split on whitespace only: a value holding a quote, a backslash, `$` or a backtick fails the step instead of being interpreted'
    required: false
    default: '--all-features --workspace'
  setup-commands:
    description: 'Shell commands run under the coverage instrumentation env BEFORE the main test run, with profiling disabled (LLVM_PROFILE_FILE=/dev/null) so they reuse the instrumented dependency build without contributing coverage. Use to fetch fixtures the tests need (e.g. an ML model file). One command per line, evaluated as shell (`eval`, in one bash shell with `-e -o pipefail`), so never pass untrusted text. Empty runs nothing'
    required: false
    default: ''
  extra-test-commands:
    description: 'Additional `cargo test`/`cargo llvm-cov` invocations run under the instrumentation env AFTER the main test run, contributing to the head coverage corpus. Use for model-gated/`--ignored` suites that the single `test-args` run cannot reach. One command per line, evaluated as shell (`eval`, in one bash shell with `-e -o pipefail`), so never pass untrusted text. Empty runs nothing. NOT applied to the merge-base worktree recompute'
    required: false
    default: ''
  fail-under-lines:
    description: 'Overall line-coverage gate. Fat mode uses `cargo llvm-cov report --fail-under-lines`; thin mode uses `patchcov diff --fail-under-lines`, which reads the lcov itself, so its figure can differ slightly from llvm-cov''s. Empty disables the gate'
    required: false
    default: '30'
  llvm-cov-ignore-filename-regex:
    description: 'Fat mode only. Exclude files from what cargo-llvm-cov computes: passed as --ignore-filename-regex to every `cargo llvm-cov report` the action runs (the head lcov, codecov.json, the summary, the `fail-under-lines` gate) and to the one in the merge-base recompute. It is cargo-llvm-cov''s own filter, so not `ignore-filename-regex`''s rules: ONE regex (join several with |; a comma is part of it), in LLVM''s POSIX extended syntax, matched against the ABSOLUTE path, so write a fragment from inside the repository such as src/gpu/, not an anchored ^src/gpu/ or one with the checkout directory''s name (the recompute builds in a different directory). A pattern LLVM cannot compile (a (?i) flag, (?:...), a lazy .*?, an empty alternative) is ignored silently TOGETHER WITH cargo-llvm-cov''s default exclusions, so check the summary after setting it. Set `ignore-filename-regex` too: that one filters a baseline published before this was set. Empty disables'
    required: false
    default: ''

  # ---------------------------------------------------------------------------
  # Diff / patch-coverage comment (patchcov diff)
  # ---------------------------------------------------------------------------
  base-ref:
    description: 'Base revision to diff against. Empty computes `git merge-base origin/main HEAD`'
    required: false
    default: ''
  fail-under-patch:
    description: 'Patch-coverage gate via `patchcov diff --fail-under-patch`. Empty disables the gate. Enforced after the comment is posted'
    required: false
    default: ''
  collapse-ranges:
    description: 'Collapse consecutive uncovered new lines into ranges (e.g. 9-11) in the comment'
    required: false
    default: 'true'
  all-files:
    description: 'Report deltas/indirect changes for ALL files, not just the ones the diff touches'
    required: false
    default: 'false'
  strip-prefix:
    description: 'Override the path prefix stripped from report file paths to make them repo-relative'
    required: false
    default: ''
  ignore-filename-regex:
    description: 'Exclude files whose repo-relative path matches any of these regexes from BOTH the head and baseline reports before the diff, so the comment, the patch gate and the thin-mode line gate all measure the same files. Separate patterns with bare commas on ONE line: a newline, or a space or tab at either end or beside a comma, would become part of a pattern and match no path, so the step refuses such a value (a YAML `|` block keeps its line breaks, `|-` only drops the last: write a plain or quoted one-line value; write `[ ]` for a space that is meant). A pattern cannot contain a comma. Matched after strip-prefix and unanchored, like cargo llvm-cov --ignore-filename-regex except that it sees the repo-relative path, not the absolute one, and takes Rust regex syntax, not LLVM''s. It does not reach what cargo-llvm-cov computes in fat mode (the summary, the `fail-under-lines` gate): `llvm-cov-ignore-filename-regex` does. Empty disables'
    required: false
    default: ''
  report-format:
    description: 'Format of the head report: auto, lcov, llvm-cov-json, or cobertura (auto-detected by default)'
    required: false
    default: ''
  comment:
    description: 'Post the rendered diff as a sticky pull-request comment'
    required: false
    default: 'true'
  comment-header:
    description: 'Sticky comment header (key that lets the comment update in place each run)'
    required: false
    default: 'coverage'

  # ---------------------------------------------------------------------------
  # Merge-base baseline (download + worktree recompute fallback)
  # ---------------------------------------------------------------------------
  baseline-artifact-name:
    description: 'Name of the artifact holding the per-line baseline report'
    required: false
    default: 'coverage-baseline'
  baseline-workflow:
    description: 'Workflow file the baseline artifact is published from (for the merge-base download). One the API does not know yet (its file is not on the default branch) is a miss with a warning, not a failure'
    required: false
    default: 'ci.yml'
  baseline-ancestor-depth:
    description: 'When the merge-base has no baseline, how many of its first-parent ancestors to try, nearest first, before giving up (fat mode then recomputes). The first baseline found is used and the comment says so: its deltas also include whatever changed since. `0` uses the merge-base''s own baseline only. Each commit tried costs at least one GitHub API request'
    required: false
    default: '10'
  recompute-baseline:
    description: 'When no baseline is found (the merge-base''s, or an ancestor''s within `baseline-ancestor-depth`), recompute coverage at the merge-base in a git worktree (fat mode only)'
    required: false
    default: 'true'
  worktree-system-deps:
    description: 'Space-separated apt packages to install before the worktree recompute (e.g. libasound2-dev). Split on whitespace only: a value holding a quote, a backslash, `$` or a backtick, or a word starting with a dash, fails the step. Empty installs nothing'
    required: false
    default: ''
  publish-baseline:
    description: 'On a push to main, publish this run''s report as the baseline artifact for future PRs'
    required: false
    default: 'true'

  # ---------------------------------------------------------------------------
  # Artifacts
  # ---------------------------------------------------------------------------
  upload-artifacts:
    description: 'Upload the coverage summary / report / codecov.json as a build artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name of the uploaded coverage-summary artifact'
    required: false
    default: 'coverage-summary'

  # ---------------------------------------------------------------------------
  # codecov.io upload (optional, off by default)
  # ---------------------------------------------------------------------------
  codecov:
    description: 'Upload codecov.json to codecov.io'
    required: false
    default: 'false'
  codecov-token:
    description: 'codecov.io upload token (pass your CODECOV_TOKEN secret)'
    required: false
    default: ''

outputs:
  version:
    description: 'Resolved patchcov version that was installed (no leading v)'
    value: ${{ steps.resolve-version.outputs.version }}
  release-tag:
    description: 'Resolved patchcov release tag (v-prefixed)'
    value: ${{ steps.resolve-version.outputs.release-tag }}
  patchcov-cache-hit:
    description: '`true` when the patchcov binary was restored from the cache, so the install steps did not run; `false` when it was installed'
    value: ${{ steps.cache-patchcov.outputs.cache-hit == 'true' }}
  patch-percent:
    description: 'Patch (diff) coverage percentage for this PR'
    value: ${{ steps.diff.outputs.patch-percent }}
  line-percent:
    description: 'Overall line coverage percentage (requires a baseline)'
    value: ${{ steps.diff.outputs.line-percent }}
  comment-path:
    description: 'Path to the rendered markdown comment'
    value: ${{ steps.diff.outputs.comment-path }}

runs:
  using: 'composite'
  steps:
    # -------------------------------------------------------------------------
    # Check the inputs that can be wrong without anything saying so
    # -------------------------------------------------------------------------
    - name: Check the ignore-filename-regex value
      # The value is a comma-separated list on one line, and nothing is trimmed (#48). A newline,
      # or a space or tab at either end or beside a comma, is not a separator: it becomes part
      # of a pattern, which then matches no path, so nothing is excluded and nothing says so.
      # A YAML `|` block does it by ending in a newline (scenario 8d shows the runner keeps it).
      # Refused here, first, so a mistake in a
      # workflow file fails in seconds and not after the install. A space inside a pattern
      # (`src/my dir/`) is a character and stays; `[ ]` writes one beside a comma.
      # Runs where the value is used: a diff on a pull request, or
      # the thin-mode line gate. A fat-mode push runs no `patchcov diff`, so a value
      # set there is not looked at, it is not used there.
      if: inputs.ignore-filename-regex != '' && (github.event_name == 'pull_request' || (inputs.run-coverage != 'true' && inputs.fail-under-lines != ''))
      shell: bash
      env:
        IGNORE_FILENAME_REGEX: ${{ inputs.ignore-filename-regex }}
      run: |
        problem=""
        case "$IGNORE_FILENAME_REGEX" in
          *$'\n'* | *$'\r'*) problem="a line break" ;;
        esac
        if [ -z "$problem" ]; then
          if [[ "$IGNORE_FILENAME_REGEX" =~ ^[[:space:]] || "$IGNORE_FILENAME_REGEX" =~ [[:space:]]$ ]]; then
            problem="a space or tab at the start or end"
          elif [[ "$IGNORE_FILENAME_REGEX" =~ [[:space:]], || "$IGNORE_FILENAME_REGEX" =~ ,[[:space:]] ]]; then
            problem="a space or tab beside a comma"
          fi
        fi
        if [ -n "$problem" ]; then
          # Shown with what is not printable replaced by ?, and cut short: a line break in a
          # message would start another workflow command on the next line.
          shown="${IGNORE_FILENAME_REGEX//[^[:print:]]/?}"
          note=""
          [ "$shown" = "$IGNORE_FILENAME_REGEX" ] || note=", where a ? stands for a line break or another character that does not print"
          [ "${#shown}" -le 60 ] || shown="${shown:0:60}..."
          echo "::error::The 'ignore-filename-regex' input holds $problem (got '$shown'$note). Patterns are separated by a comma and nothing is trimmed, so that character would become part of a pattern, which matches no path: the files would stay in the comment and the gates, with no warning. Write all the patterns on ONE line with bare commas ('a,b'), as a plain or quoted value: a YAML | block keeps its line breaks (|- only drops the last one). Write [ ] for a space that is meant."
          exit 1
        fi

    # -------------------------------------------------------------------------
    # Install + cache patchcov
    # -------------------------------------------------------------------------
    - name: Warn about legacy coverage settings
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/check-legacy-config.sh"

    - name: Resolve patchcov version
      id: resolve-version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ "$VERSION" = "latest" ]; then
          RELEASE_TAG=""
          refused=""
          # The API answer is read with jq, and the jq calls below end in `|| true` and
          # send stderr away, so a runner with no jq would be retried three times and
          # reported as a rate limit. With none, the API is not asked at all: the redirect
          # further down needs only curl and bash, and says why the API was skipped.
          no_jq=""
          if ! command -v jq >/dev/null; then
            no_jq=yes
          fi
          # Authenticate the API call so it draws on the 1000/hr authenticated
          # rate limit rather than the 60/hr unauthenticated, shared-runner-IP
          # limit that intermittently fails this step. The token comes in through
          # the environment, not as an expression in this script, so the runner
          # never writes it into the script text. It does reach curl's arguments.
          # Keep expressions out of this script's comments and messages too: the
          # runner evaluates every one it finds, escaped or not.
          auth=()
          if [ -n "$GH_TOKEN" ]; then
            auth=(-H "Authorization: Bearer $GH_TOKEN")
          fi
          for attempt in 1 2 3; do
            [ -z "$no_jq" ] || break
            # -w puts the HTTP status on a line after the body (curl still prints 000 for a
            # connection that failed). There is no --fail: a 403 keeps its JSON body, which
            # is where GitHub's reason comes from. The status is split off below.
            answer=$(curl -sS \
              --connect-timeout 10 --max-time 30 \
              -w '\n%{http_code}' \
              "${auth[@]}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/rust-works/patchcov/releases/latest || true)
            api_status="${answer##*$'\n'}"
            response="${answer%$'\n'*}"
            RELEASE_TAG=$(printf '%s' "$response" | jq -r '.tag_name // empty' 2>/dev/null || true)
            [ -n "$RELEASE_TAG" ] && break
            api_message=$(printf '%s' "$response" | jq -r '.message // "no tag_name in response"' 2>/dev/null || true)
            # The API answered and refused: a bad or revoked token (401), a spent rate limit
            # (403 or 429). Asking again 3s and 6s later cannot change that, and a limit can
            # outlast any wait these attempts could make, so go to the redirect at once.
            # A 403 can be a rate limit or a plain refusal, and a secondary limit asks for a
            # wait of a minute or more: a few seconds helps neither, so all three are final.
            # What is retried is what a retry can help: no answer, a timeout, a 5xx, a body
            # that is not JSON, JSON with no tag.
            case "$api_status" in
              401 | 403 | 429)
                refused="$api_status"
                break
                ;;
            esac
            echo "::warning::Attempt ${attempt}/3: could not resolve latest patchcov version (API: ${api_message:-unknown error})"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
          done
          if [ -z "$RELEASE_TAG" ]; then
            # What the API did, for the messages below: not "after 3 attempts" when it was
            # asked once, and not an API failure at all when it was not asked. And what to do
            # about it, for the warning and the error: check the token when the API answered,
            # install jq when it was not asked. The first two are the words of the messages
            # before the API could be skipped, and are kept as they were.
            fix="Check that github-token holds a valid token (it defaults to the workflow token), or set 'version' to a release to skip the lookup."
            error_fix="If this is a rate limit, check that github-token holds a valid token (it defaults to the workflow token), or set 'version' to a release to skip the lookup."
            if [ -n "$no_jq" ]; then
              api_gave="The GitHub API was not asked (jq, which reads its answer, was not found on PATH)"
              fix="Install jq so the API can be asked, or set 'version' to a release to skip the lookup."
              error_fix="$fix"
            elif [ -n "$refused" ]; then
              api_gave="The GitHub API refused the request (HTTP ${refused}) and was not asked again, since retrying cannot change that (API: ${api_message:-unknown error})"
            else
              api_gave="The GitHub API gave no release after 3 attempts (API: ${api_message:-unknown error})"
            fi
            # The API gave no release, and a spent rate limit can last up to an hour,
            # longer than the attempts above can wait. The releases/latest page is an
            # ordinary web request that draws on no API quota, and it redirects to
            # .../releases/tag/<tag>. One request, no -L: the Location header is the
            # answer, and following it would fetch the tag's page for nothing. No
            # token either: it buys nothing on github.com. curl prints the status and
            # the URL separated by a space (000 and nothing for a refused connection),
            # and under -e `|| true` lets that reach the message instead of ending the
            # step with curl's bare exit code. The URL is read from a header, so it is
            # used only if it is this repository's release tag: v, three numbers and
            # an optional semver pre-release (dot-separated identifiers).
            redirect=$(curl -sS \
              --connect-timeout 10 --max-time 30 \
              -o /dev/null -w '%{http_code} %{redirect_url}' \
              https://github.com/rust-works/patchcov/releases/latest || true)
            read -r redirect_status redirect_to <<<"$redirect"
            tag_url='^https://github\.com/rust-works/patchcov/releases/tag/(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$'
            if [[ "$redirect_to" =~ $tag_url ]]; then
              RELEASE_TAG="${BASH_REMATCH[1]}"
              echo "::warning::${api_gave}, so latest patchcov was resolved from the github.com releases/latest redirect instead: ${RELEASE_TAG}. ${fix}"
            fi
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::Could not determine latest patchcov version. ${api_gave} and the github.com releases/latest redirect gave no release tag (HTTP ${redirect_status:-000}${redirect_to:+ to $redirect_to}). ${error_fix}"
            exit 1
          fi
          VERSION="$RELEASE_TAG"
          echo "Resolved latest patchcov release: $RELEASE_TAG"
        fi
        # Release tags carry a leading v, so a caller may pin one as written. Drop it
        # from whatever came in, not only from the tag above: left in, release-tag
        # becomes vv0.4.0, the download 404s and `cargo install --version` refuses it.
        # A capital V is dropped too: it has one reading, and release-tag stays lowercase.
        given="$VERSION"
        VERSION="${VERSION#[vV]}"
        # Nothing left means no release was named: an empty value, or just the v. Stop
        # here, before an output is written. Passed on, the version output is empty (a
        # cache key ending --binary), the download 404s and the platform step blames
        # the release rather than this input.
        if [ -z "$VERSION" ]; then
          echo "::error::The 'version' input names no release (got '$given'). Set it to a release number such as 0.4.0 or v0.4.0, or to 'latest'."
          exit 1
        fi
        # The value goes into the step's outputs, a cache key, the download URL and
        # `cargo install --version`, so it must be written with the characters a release
        # number or a version requirement uses, and with none that change what it means once
        # it is written: not a newline or carriage return (a new output line), not a slash (a
        # new path segment of the download URL, where curl resolves the dot segments), not a
        # percent sign, question mark or hash (an escaped dot segment, a query, a fragment),
        # nor a quote, dollar sign or backtick. An allowlist, so a character nobody thought
        # of is refused as well. It lets through what `cargo install --version` takes (^0.45,
        # >=0.45, 0.45.*), which the source install has always accepted. Not a comma: the
        # cache key holds this value, and actions/cache refuses a key with a comma in it, so a
        # range with one could never get past the next step. It sits after the
        # `latest` branch, as the strip does, so a tag the API gave is held to it too. Letters
        # are listed, not ranged: a range follows the locale.
        allowed='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.+*^~<>= -'
        case "$VERSION" in
          *[!"$allowed"]*)
            # Shown with what is not printable replaced, and cut short: a newline in a
            # message would start another workflow command on the next line.
            shown="${given//[^[:print:]]/?}"
            [ "${#shown}" -le 60 ] || shown="${shown:0:60}..."
            echo "::error::The 'version' input holds a character that a release number is not written with (got '$shown'). It may hold letters, digits and . + - * ^ ~ < > = and spaces. Set it to a release number such as 0.4.0 or v0.4.0, or to 'latest'."
            exit 1
            ;;
        esac
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "release-tag=v$VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache patchcov binary
      id: cache-patchcov
      uses: actions/cache@v6
      with:
        path: ~/.cargo/bin/patchcov
        key: ${{ inputs.cache-prefix }}patchcov-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve-version.outputs.version }}-${{ inputs.use-prebuilt-binary == 'true' && 'binary' || 'cargo' }}

    - name: Add cargo bin to PATH
      shell: bash
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Determine platform and download URL
      id: platform
      if: steps.cache-patchcov.outputs.cache-hit != 'true' && inputs.use-prebuilt-binary == 'true'
      shell: bash
      env:
        RELEASE_TAG: ${{ steps.resolve-version.outputs.release-tag }}
        OS: ${{ runner.os }}
        ARCH: ${{ runner.arch }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # A binary that cannot be had is reported through `reason`, which "Fail if
        # binary not available" prints as the one error. Nothing is guessed: a
        # platform with no asset gets no binary, not the nearest one.
        unavailable() {
          echo "binary-available=false" >> "$GITHUB_OUTPUT"
          echo "reason=$1" >> "$GITHUB_OUTPUT"
          exit 0
        }

        # The asset is chosen from the OS and the architecture (see the script).
        if ! BINARY_NAME=$(bash "$ACTION_PATH/scripts/patchcov-asset.sh" "$OS" "$ARCH" "$RELEASE_TAG"); then
          unavailable "No pre-built patchcov binary is published for $OS $ARCH. Set 'use-prebuilt-binary: false' to build from source."
        fi

        DOWNLOAD_URL="https://github.com/rust-works/patchcov/releases/download/${RELEASE_TAG}/${BINARY_NAME}"

        # Verify the binary exists. Only a 404 says it does not: any other status
        # (a refused connection prints 000, a server error 5xx) says the lookup failed.
        # curl prints 000 but also exits non-zero for a refused connection, and this
        # shell runs with -e, so without `|| true` the step would end there with a bare
        # exit code instead of reaching the message below.
        HTTP_STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "$DOWNLOAD_URL" || true)
        case "$HTTP_STATUS" in
          200 | 302) ;;
          404)
            unavailable "patchcov $RELEASE_TAG has no pre-built $BINARY_NAME for $OS $ARCH. Set 'version' to a release that has it, or set 'use-prebuilt-binary: false' to build from source."
            ;;
          *)
            unavailable "Could not check whether patchcov $RELEASE_TAG has a pre-built $BINARY_NAME (HTTP $HTTP_STATUS from $DOWNLOAD_URL). Re-run the job, or set 'use-prebuilt-binary: false' to build from source."
            ;;
        esac

        echo "binary-available=true" >> $GITHUB_OUTPUT
        echo "download-url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
        echo "binary-name=$BINARY_NAME" >> $GITHUB_OUTPUT

    - name: Download pre-built binary
      if: steps.cache-patchcov.outputs.cache-hit != 'true' && inputs.use-prebuilt-binary == 'true' && steps.platform.outputs.binary-available == 'true'
      shell: bash
      env:
        DOWNLOAD_URL: ${{ steps.platform.outputs.download-url }}
        BINARY_NAME: ${{ steps.platform.outputs.binary-name }}
      run: |
        mkdir -p ~/.cargo/bin

        echo "Downloading patchcov from $DOWNLOAD_URL"
        curl -sL "$DOWNLOAD_URL" -o "/tmp/$BINARY_NAME"

        # Releases hold patchcov inside a tag/target directory. Use an isolated
        # directory so a previous download cannot supply a missing binary.
        extract="$(mktemp -d /tmp/patchcov-extract.XXXXXX)"
        trap 'rm -rf "$extract"' EXIT
        tar -xzf "/tmp/$BINARY_NAME" -C "$extract"
        binary="$extract/${BINARY_NAME%.tar.gz}/patchcov"
        if [ ! -f "$binary" ]; then
          echo "::error::$BINARY_NAME has no ${BINARY_NAME%.tar.gz}/patchcov in it, so there is no patchcov to install."
          exit 1
        fi
        mv "$binary" ~/.cargo/bin/patchcov

        chmod +x ~/.cargo/bin/patchcov
        echo "Successfully installed patchcov from pre-built binary"
        # The binary is not run here: "Print patchcov version" is the one step that runs it
        # after every way of installing, and the one that says why a binary cannot start
        # (#67). Run here, a binary the runner's glibc is too old for would stop this step
        # first, with the loader's bare message, and that step would never run.

    - name: Fail if binary not available
      if: steps.cache-patchcov.outputs.cache-hit != 'true' && inputs.use-prebuilt-binary == 'true' && steps.platform.outputs.binary-available == 'false'
      shell: bash
      env:
        REASON: ${{ steps.platform.outputs.reason }}
      run: |
        echo "::error::${REASON:-Pre-built binary not available for this platform/version. Set 'use-prebuilt-binary: false' to build from source.}"
        exit 1

    - name: Setup Rust toolchain (source install)
      if: steps.cache-patchcov.outputs.cache-hit != 'true' && inputs.use-prebuilt-binary != 'true'
      uses: dtolnay/rust-toolchain@stable

    - name: Install patchcov from source
      if: steps.cache-patchcov.outputs.cache-hit != 'true' && inputs.use-prebuilt-binary != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.resolve-version.outputs.version }}
      run: |
        echo "Installing patchcov $VERSION via cargo install..."
        env -u VERSION cargo install patchcov --version "$VERSION"

    - name: Print patchcov version
      shell: bash
      env:
        PATCHCOV_VERSION: ${{ steps.resolve-version.outputs.version }}
        OS: ${{ runner.os }}
        ARCH: ${{ runner.arch }}
      run: |
        # A pre-built binary that needs a newer glibc than the runner has is stopped by the
        # dynamic loader, which says only that a version is not found, far from the step
        # that chose the binary and without saying what to do (#67). Run the binary once and
        # keep what it said. When that is what stopped it, say which glibc it wants, which
        # one the runner has and the two ways out. Anything else that stops it is shown as
        # before and keeps its exit status.
        status=0
        output="$(patchcov --version 2>&1)" || status=$?
        printf '%s\n' "$output"
        [ "$status" -ne 0 ] || exit 0
        # The loader names each missing version as `...: version `GLIBC_2.38' not found`. A
        # weak one, `...: weak version `GLIBC_2.39' not found`, is optional and did not stop
        # the binary, so it is not asked for. They are not listed in order (the ARM64 binary
        # names 2.39 before 2.38), so the newest of the others is taken, as numbers. A
        # libstdc++ that is too old says GLIBCXX, which is another problem and not matched.
        needed="$(printf '%s\n' "$output" |
          sed -n -E "s/.*: version .GLIBC_([0-9]+(\.[0-9]+)*). not found.*/\1/p" |
          sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
        if [ -n "$needed" ]; then
          have="$(getconf GNU_LIBC_VERSION 2>/dev/null || true)"
          if [ -n "$have" ]; then
            runner_has="glibc ${have#glibc }"
          else
            runner_has="an older glibc"
          fi
          # The images are named only when they would do: ubuntu-24.04 has glibc 2.39, so for
          # a binary that needs more, naming it would send the caller to another failure.
          major="${needed%%.*}"
          minor="${needed#*.}"
          [ "$minor" != "$needed" ] || minor=0
          minor="${minor%%.*}"
          images=""
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -le 39 ]; }; then
            images=" (ubuntu-24.04, or ubuntu-24.04-arm)"
          fi
          echo "::error::patchcov $PATCHCOV_VERSION cannot run on this runner ($OS $ARCH): it needs glibc $needed or newer, and the runner has $runner_has. Use a runner image with glibc $needed or newer$images, or set 'use-prebuilt-binary: false' to build patchcov from source."
        fi
        exit "$status"

    - name: Combine shard reports
      # Thin mode with a sharded run: check each shard and join them into
      # `report`, so every later step reads one ordinary lcov. A bare `cat` would
      # glue records (llvm-cov writes no trailing newline), hence the script.
      id: shards
      if: inputs.shard-reports != ''
      shell: bash
      env:
        SHARD_REPORTS: ${{ inputs.shard-reports }}
        REPORT: ${{ inputs.report }}
        REPORT_FORMAT: ${{ inputs.report-format }}
        RUN_COVERAGE: ${{ inputs.run-coverage }}
        STRIP_PREFIX: ${{ inputs.strip-prefix }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/combine-shards.sh"

    # -------------------------------------------------------------------------
    # Coverage run (fat mode). Every cargo step below sources cargo-llvm-cov's
    # instrumentation env so they share ONE set of dependency artifacts.
    # -------------------------------------------------------------------------
    - name: Setup Rust toolchain (coverage)
      if: inputs.run-coverage == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Rust cache
      if: inputs.run-coverage == 'true'
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-llvm-cov
      if: inputs.run-coverage == 'true'
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Clean coverage profile data
      if: inputs.run-coverage == 'true'
      shell: bash
      run: |
        # shellcheck disable=SC1090
        eval "$(cargo llvm-cov show-env --sh)"
        cargo llvm-cov clean --workspace

    - name: Coverage setup commands
      # Runs under the instrumentation env so it reuses the instrumented
      # dependency build, but with profiling sent to /dev/null so it contributes
      # NO coverage — e.g. an ML-model download the gated tests below need. Must
      # run after `clean` (so it isn't wiped) and before the test runs.
      if: inputs.run-coverage == 'true' && inputs.setup-commands != ''
      shell: bash
      env:
        SETUP_COMMANDS: ${{ inputs.setup-commands }}
      run: |
        # shellcheck disable=SC1090
        eval "$(cargo llvm-cov show-env --sh)"
        export LLVM_PROFILE_FILE=/dev/null
        # The input is shell by design. It is evaluated here, in this step's own shell
        # (bash -e -o pipefail, the instrumentation env loaded), so every line shares
        # state; the runner never splices it into this script as an expression. The
        # variable is dropped first so the commands do not see it in their environment.
        commands="$SETUP_COMMANDS"
        unset SETUP_COMMANDS
        eval "$commands"

    - name: Run tests with coverage
      if: inputs.run-coverage == 'true'
      shell: bash
      env:
        TEST_ARGS: ${{ inputs.test-args }}
      run: |
        # The value is split on whitespace only: no quote removal, no expansion, no
        # globbing. A value that used to rely on the shell parsing it fails here, loudly,
        # rather than reaching cargo as different arguments from the ones written.
        case "$TEST_ARGS" in
          *[\"\'\\\`\$]*)
            echo '::error::test-args holds a quote, a backslash, a dollar sign or a backtick. It is split on whitespace only and none of those is interpreted, so cargo would get arguments other than the ones written. Write plain whitespace-separated arguments.'
            exit 1
            ;;
        esac
        set -f
        test_args=($TEST_ARGS)
        set +f
        # The caller's tests run next: they should not see the action's variable.
        unset TEST_ARGS
        # shellcheck disable=SC1090
        eval "$(cargo llvm-cov show-env --sh)"
        cargo test "${test_args[@]}"

    - name: Run extra (gated) tests with coverage
      # Additional instrumented suites the single `test-args` run cannot reach
      # (e.g. `--ignored` model-gated tests). They share the same profile corpus,
      # so their coverage lands in the head report and counts toward the line
      # gate. Deliberately NOT run in the worktree recompute below.
      if: inputs.run-coverage == 'true' && inputs.extra-test-commands != ''
      shell: bash
      env:
        EXTRA_TEST_COMMANDS: ${{ inputs.extra-test-commands }}
      run: |
        # shellcheck disable=SC1090
        eval "$(cargo llvm-cov show-env --sh)"
        # Shell by design, evaluated in this step's own shell, as the setup commands are.
        commands="$EXTRA_TEST_COMMANDS"
        unset EXTRA_TEST_COMMANDS
        eval "$commands"

    # The reports below, and the line gate at the end, share ONE profile merge.
    # Every `cargo llvm-cov report` runs `llvm-profdata merge` over all the raw
    # profiles it finds first, and a run that leaves thousands of them (tests that
    # spawn processes) spends minutes there per call. So the first report merges
    # and the raw profiles are then removed: a report that finds none skips the
    # merge and reads the merged profile (`target/<name>.profdata`) instead.

    - name: Generate head coverage report (lcov)
      # Per-line lcov for the head commit: the input to `patchcov diff`.
      # It is the first report because the first one pays for the merge, and this
      # is the one a pull request cannot do without. Keep it ahead of every other
      # `cargo llvm-cov report` step: one placed before it merges again.
      if: inputs.run-coverage == 'true'
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
        LLVM_COV_IGNORE_FILENAME_REGEX: ${{ inputs.llvm-cov-ignore-filename-regex }}
      run: |
        # shellcheck disable=SC1090
        eval "$(cargo llvm-cov show-env --sh)"
        # The filter (every `cargo llvm-cov report` here takes it) is read from the
        # environment, not interpolated into the script: a regex is full of `\`, `$` and
        # quotes that bash would reinterpret. `${VAR:+...}` is one word when it is set and
        # nothing when it is not (cargo-llvm-cov rejects an empty value), and it is passed as
        # `--flag=value` so a pattern that starts with `-` is not read as a flag.
        cargo llvm-cov report --lcov --output-path "$REPORT" \
          ${LLVM_COV_IGNORE_FILENAME_REGEX:+"--ignore-filename-regex=$LLVM_COV_IGNORE_FILENAME_REGEX"}

    - name: Remove merged raw coverage profiles
      # The lcov step merged them into one profile, so they have done their job.
      # With none left, every later `cargo llvm-cov report` skips its own merge and
      # reads that profile. `--profraw-only` keeps the profile; the next run starts
      # with `clean --workspace`, which removes it, so a stale one is never reused.
      # Not `continue-on-error`: a removal that stopped halfway would leave some raw
      # profiles, and the next report would merge only those over the full profile,
      # reporting a fraction of the coverage without any error.
      if: inputs.run-coverage == 'true'
      shell: bash
      run: |
        # shellcheck disable=SC1090
        eval "$(cargo llvm-cov show-env --sh)"
        cargo llvm-cov clean --profraw-only

    - name: Generate codecov.json
      # Kept ready so the optional codecov.io upload below works when enabled.
      # Reads the profile the lcov step merged.
      if: inputs.run-coverage == 'true'
      shell: bash
      env:
        LLVM_COV_IGNORE_FILENAME_REGEX: ${{ inputs.llvm-cov-ignore-filename-regex }}
      run: |
        # shellcheck disable=SC1090
        eval "$(cargo llvm-cov show-env --sh)"
        cargo llvm-cov report --codecov --output-path codecov.json \
          ${LLVM_COV_IGNORE_FILENAME_REGEX:+"--ignore-filename-regex=$LLVM_COV_IGNORE_FILENAME_REGEX"}

    - name: Build coverage summary
      # Full per-file summary: appended to the run's Summary tab and published as
      # a build artifact. Intentionally NOT inlined into the PR comment. Reads the
      # profile the lcov step merged.
      if: inputs.run-coverage == 'true'
      shell: bash
      env:
        LLVM_COV_IGNORE_FILENAME_REGEX: ${{ inputs.llvm-cov-ignore-filename-regex }}
      run: |
        # shellcheck disable=SC1090
        eval "$(cargo llvm-cov show-env --sh)"
        cargo llvm-cov report --summary-only \
          ${LLVM_COV_IGNORE_FILENAME_REGEX:+"--ignore-filename-regex=$LLVM_COV_IGNORE_FILENAME_REGEX"} \
          | tee coverage-summary.txt
        {
          echo '## Coverage'
          echo '```'
          cat coverage-summary.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage artifacts
      # The full summary lives here (not in the PR comment); codecov.json kept for
      # when the upload is enabled. Runs before the comment so the comment can
      # link to this artifact via the step's `artifact-url` output.
      id: upload
      if: inputs.upload-artifacts == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        if-no-files-found: ignore
        path: |
          coverage-summary.txt
          codecov.json
          ${{ inputs.report }}

    # -------------------------------------------------------------------------
    # Merge-base baseline + diff/patch-coverage comment (pull requests only)
    # -------------------------------------------------------------------------
    - name: Determine merge-base
      # The PR's fork point on main. Pinning the baseline to this immutable commit
      # makes per-file deltas attributable to THIS PR alone.
      id: mb
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        if [ -n "$BASE_REF" ]; then
          SHA="$BASE_REF"
        else
          SHA="$(git merge-base origin/main HEAD)"
        fi
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

    - name: Find baseline coverage
      # Which run's baseline to download: the merge-base's own, else the nearest
      # first-parent ancestor's (`baseline-ancestor-depth`). It is a script, not
      # dawidd6's `commit` lookup, because that takes the newest successful run of ONE
      # commit and looks only in it: a run with no artifact (a `merge_group` run) hides
      # the `push` run that has it, there is no walk to an ancestor, and a workflow the
      # API does not know yet fails the step. A miss is a warning, not a failure.
      id: baseline-lookup
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BASELINE_WORKFLOW: ${{ inputs.baseline-workflow }}
        BASELINE_ARTIFACT: ${{ inputs.baseline-artifact-name }}
        BASE_REF: ${{ steps.mb.outputs.sha }}
        ANCESTOR_DEPTH: ${{ inputs.baseline-ancestor-depth }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/find-baseline.sh"

    - name: Download baseline coverage
      # By run id, so it downloads what the lookup found and nothing else.
      id: baseline
      if: github.event_name == 'pull_request' && steps.baseline-lookup.outputs.found == 'true'
      uses: dawidd6/action-download-artifact@v27
      with:
        name: ${{ inputs.baseline-artifact-name }}
        run_id: ${{ steps.baseline-lookup.outputs.run-id }}
        path: baseline
        if_no_artifact_found: warn

    - name: Compute baseline from merge-base (fallback)
      # Sets `recomputed` when it builds the baseline, so the comment does not call it an
      # ancestor's: the lookup can have found one whose download left no file under this
      # report's name (it expired in between, or the report was renamed since).
      # Runs when no baseline is in reach: none for the merge-base or for any of the
      # `baseline-ancestor-depth` ancestors tried (cold start, expired artifacts). Builds
      # coverage at the merge-base itself in a worktree so the comparison stays correct.
      # A no-op when a baseline was downloaded, the merge-base's or an ancestor's.
      # Uses only `test-args` — `setup-commands`/`extra-test-commands` are NOT
      # replayed here: gated suites/fixtures may not exist at an old merge-base,
      # and the normal path downloads a baseline that already includes them.
      id: recompute
      if: github.event_name == 'pull_request' && inputs.run-coverage == 'true' && inputs.recompute-baseline == 'true'
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
        WORKTREE_SYSTEM_DEPS: ${{ inputs.worktree-system-deps }}
        TEST_ARGS: ${{ inputs.test-args }}
        BASE_SHA: ${{ steps.mb.outputs.sha }}
        LLVM_COV_IGNORE_FILENAME_REGEX: ${{ inputs.llvm-cov-ignore-filename-regex }}
      run: |
        REPORT_BASENAME="$(basename "$REPORT")"
        if [ -f "baseline/$REPORT_BASENAME" ]; then
          echo "a baseline was downloaded; skipping recompute"
          exit 0
        fi
        # Optional system deps for building historical commits (e.g. a merge-base
        # that predates a native-dependency removal). No-op when unset. Packages and
        # test arguments are split on whitespace only: no quote removal, no expansion, no
        # globbing. The test arguments passed the same check in "Run tests with coverage".
        case "$WORKTREE_SYSTEM_DEPS" in
          *[\"\'\\\`\$]*)
            echo '::error::worktree-system-deps holds a quote, a backslash, a dollar sign or a backtick. It is split on whitespace only and none of those is interpreted. Write package names separated by spaces.'
            exit 1
            ;;
        esac
        set -f
        system_deps=($WORKTREE_SYSTEM_DEPS)
        test_args=($TEST_ARGS)
        set +f
        for dep in "${system_deps[@]}"; do
          case "$dep" in
            -*)
              echo "::error::worktree-system-deps holds '$dep', which starts with a dash and would be read by apt-get as an option. Name packages only."
              exit 1
              ;;
          esac
        done
        if [ -n "$WORKTREE_SYSTEM_DEPS" ]; then
          sudo apt-get update && sudo apt-get install -y "${system_deps[@]}"
        fi
        # The worktree is removed when the step ends, so a second recompute in one job finds
        # none (#78). A stale one is cleared first: a registered worktree left by an earlier
        # run that was cancelled before this step ended (a reused runner), or a record whose
        # directory is gone, stops `git worktree add`. `remove` only touches a worktree git
        # knows, so a directory that merely has the name `base` is kept, and the add then
        # fails as it did.
        git worktree remove --force ../base 2>/dev/null || true
        git worktree prune || true
        git worktree add ../base "$BASE_SHA"
        # However the step ends: the merge-base's build (`../base/target`) is as large as the
        # whole build, and the job has no further use for it. Set after the add, so a worktree
        # that was not made by this run is never removed by it. The command holds no variable
        # (the step drops its own before the tests run), and a failed removal changes nothing
        # about the step's own status.
        trap 'git worktree remove --force ../base || true' EXIT
        # The baseline is filtered like the head report, or the comparison would count
        # files on one side only. The worktree is another directory than the workspace, so
        # a pattern that holds the workspace's path or its directory's name would match the
        # head and not this.
        ignore=()
        if [ -n "$LLVM_COV_IGNORE_FILENAME_REGEX" ]; then
          ignore=("--ignore-filename-regex=$LLVM_COV_IGNORE_FILENAME_REGEX")
        fi
        # The merge-base's tests run next: they should not see the action's variables, the
        # filter's included, which is why it was copied into `ignore` first.
        unset REPORT WORKTREE_SYSTEM_DEPS TEST_ARGS BASE_SHA LLVM_COV_IGNORE_FILENAME_REGEX
        ( cd ../base && cargo llvm-cov "${test_args[@]}" --no-report \
            && cargo llvm-cov report --lcov --output-path "$REPORT_BASENAME" "${ignore[@]}" )
        mkdir -p baseline
        # Rewrite the worktree's absolute SF paths to the main workspace prefix so
        # `patchcov diff` strips one prefix for both head and baseline.
        sed "s#$(cd ../base && pwd)/#$GITHUB_WORKSPACE/#g" \
          "../base/$REPORT_BASENAME" > "baseline/$REPORT_BASENAME"
        echo "recomputed=true" >> "$GITHUB_OUTPUT"

    - name: Build coverage diff
      # Single comprehensive comment: total + delta vs main, per-file before/after,
      # patch coverage (added lines, with the uncovered file:line list), and
      # indirect coverage flips. The baseline is optional. The patch gate is NOT
      # applied here so the comment still posts when the gate fails.
      id: diff
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        BASE_SHA: ${{ steps.mb.outputs.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit
        REPORT: ${{ inputs.report }}
        COLLAPSE_RANGES: ${{ inputs.collapse-ranges }}
        ALL_FILES: ${{ inputs.all-files }}
        STRIP_PREFIX: ${{ inputs.strip-prefix }}
        REPORT_FORMAT: ${{ inputs.report-format }}
        IGNORE_FILENAME_REGEX: ${{ inputs.ignore-filename-regex }}
        BASELINE_SHA: ${{ steps.baseline-lookup.outputs.sha }}
        BASELINE_DISTANCE: ${{ steps.baseline-lookup.outputs.distance }}
        BASELINE_RECOMPUTED: ${{ steps.recompute.outputs.recomputed }}
      run: |
        REPORT_BASENAME="$(basename "$REPORT")"
        args=(diff
          --report "$REPORT"
          --base-ref "$BASE_SHA"
          --artifact-url "$ARTIFACT_URL"
          --run-url "$RUN_URL"
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --commit-url "$COMMIT_URL")
        if [ "$COLLAPSE_RANGES" = "true" ]; then
          args+=(--collapse-ranges)
        fi
        if [ "$ALL_FILES" = "true" ]; then
          args+=(--all-files)
        fi
        if [ -n "$STRIP_PREFIX" ]; then
          args+=(--strip-prefix "$STRIP_PREFIX")
        fi
        # Passed as `--flag=value`: as a separate argument a pattern that starts with `-`
        # (`-sys/`) would be read by clap as a flag. The same at the two gates below.
        if [ -n "$IGNORE_FILENAME_REGEX" ]; then
          args+=("--ignore-filename-regex=$IGNORE_FILENAME_REGEX")
        fi
        if [ -n "$REPORT_FORMAT" ]; then
          args+=(--report-format "$REPORT_FORMAT")
        fi
        # Diff is computed merge-base..HEAD, attributing patch coverage to this PR.
        if [ -f "baseline/$REPORT_BASENAME" ]; then
          args+=(--baseline-report "baseline/$REPORT_BASENAME")
        fi
        patchcov "${args[@]}" -o markdown > coverage.md
        # patchcov still calls the comparison merge-base -> head and the deltas "vs main",
        # so when the baseline is an ancestor's (`baseline-ancestor-depth`) the comment
        # says which one, unless the file is the merge-base's own recompute, which is what the
        # lookup's distance does not describe. The patch is unaffected: it is merge-base..HEAD
        # either way.
        if [ -f "baseline/$REPORT_BASENAME" ] && [ "${BASELINE_DISTANCE:-0}" -gt 0 ] \
          && [ "$BASELINE_RECOMPUTED" != true ]; then
          if [ "$BASELINE_DISTANCE" -eq 1 ]; then commits='1 commit'; else commits="$BASELINE_DISTANCE commits"; fi
          printf '\n_Baseline: the report published for [`%s`](%s/%s), %s before the merge-base, which has none. The deltas also include whatever those commits changed._\n' \
            "${BASELINE_SHA:0:7}" "$COMMIT_URL" "$BASELINE_SHA" "$commits" >> coverage.md
        fi
        echo "comment-path=coverage.md" >> "$GITHUB_OUTPUT"

        # Machine-readable percentages (best-effort; never fail the build). stderr
        # stays on the log: it is where patchcov prints a deprecation warning, and
        # the integration workflow reads those from the job logs (#23).
        if patchcov "${args[@]}" -o json > coverage.json; then
          PATCH=$(jq -r '.patch_coverage.percent // empty' coverage.json 2>/dev/null || echo "")
          LINE=$(jq -r '.project_delta.total_after // empty' coverage.json 2>/dev/null || echo "")
          echo "patch-percent=$PATCH" >> "$GITHUB_OUTPUT"
          echo "line-percent=$LINE" >> "$GITHUB_OUTPUT"
        fi

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        header: ${{ inputs.comment-header }}
        path: coverage.md

    - name: Publish coverage baseline
      # On main only: this run's per-line report becomes the baseline that
      # subsequent PRs download to compute deltas and indirect changes.
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.publish-baseline == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.baseline-artifact-name }}
        path: ${{ inputs.report }}

    - name: Upload to codecov.io
      # Fat mode has `codecov.json`. In thin mode there is none, so upload the
      # lcov instead — the shard files themselves when sharded, since codecov
      # merges several uploaded reports natively and a joined file would repeat
      # every file's record once per shard.
      if: inputs.codecov == 'true'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ inputs.codecov-token }}
        files: ${{ inputs.run-coverage == 'true' && 'codecov.json' || steps.shards.outputs.files || inputs.report }}
        fail_ci_if_error: true

    # -------------------------------------------------------------------------
    # Gates run last so the summary and PR comment post even when a gate fails.
    # -------------------------------------------------------------------------
    - name: Enforce patch-coverage gate
      if: github.event_name == 'pull_request' && inputs.fail-under-patch != ''
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
        BASE_SHA: ${{ steps.mb.outputs.sha }}
        FAIL_UNDER_PATCH: ${{ inputs.fail-under-patch }}
        STRIP_PREFIX: ${{ inputs.strip-prefix }}
        REPORT_FORMAT: ${{ inputs.report-format }}
        IGNORE_FILENAME_REGEX: ${{ inputs.ignore-filename-regex }}
      run: |
        REPORT_BASENAME="$(basename "$REPORT")"
        args=(diff
          --report "$REPORT"
          --base-ref "$BASE_SHA"
          --fail-under-patch "$FAIL_UNDER_PATCH"
          -o json)
        # Mirror the parse-affecting flags from the comment diff so the gated
        # percentage matches what the comment reported. Leaving one out is not a
        # harmless omission: `--ignore-filename-regex` changes the denominator, so
        # the gate would measure files the comment does not show.
        if [ -n "$STRIP_PREFIX" ]; then
          args+=(--strip-prefix "$STRIP_PREFIX")
        fi
        if [ -n "$IGNORE_FILENAME_REGEX" ]; then
          args+=("--ignore-filename-regex=$IGNORE_FILENAME_REGEX")
        fi
        if [ -n "$REPORT_FORMAT" ]; then
          args+=(--report-format "$REPORT_FORMAT")
        fi
        if [ -f "baseline/$REPORT_BASENAME" ]; then
          args+=(--baseline-report "baseline/$REPORT_BASENAME")
        fi
        patchcov "${args[@]}" > /dev/null

    - name: Enforce line-coverage gate
      if: inputs.run-coverage == 'true' && inputs.fail-under-lines != ''
      shell: bash
      env:
        FAIL_UNDER_LINES: ${{ inputs.fail-under-lines }}
        LLVM_COV_IGNORE_FILENAME_REGEX: ${{ inputs.llvm-cov-ignore-filename-regex }}
      run: |
        # Reads the profile the lcov step merged; it does not merge again.
        # shellcheck disable=SC1090
        eval "$(cargo llvm-cov show-env --sh)"
        # The filter changes the denominator, so a gate that left it out would measure files
        # the summary no longer shows.
        cargo llvm-cov report --summary-only --fail-under-lines "$FAIL_UNDER_LINES" \
          ${LLVM_COV_IGNORE_FILENAME_REGEX:+"--ignore-filename-regex=$LLVM_COV_IGNORE_FILENAME_REGEX"}

    - name: Enforce line-coverage gate (thin mode)
      # No profile data here for `cargo llvm-cov report`, so the gate reads the
      # lcov itself. It looks only at the head report, so no baseline is needed.
      if: inputs.run-coverage != 'true' && inputs.fail-under-lines != ''
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
        BASE_SHA: ${{ steps.mb.outputs.sha }}
        FAIL_UNDER_LINES: ${{ inputs.fail-under-lines }}
        STRIP_PREFIX: ${{ inputs.strip-prefix }}
        REPORT_FORMAT: ${{ inputs.report-format }}
        IGNORE_FILENAME_REGEX: ${{ inputs.ignore-filename-regex }}
      run: |
        # On a push there is no merge-base (the step is skipped): HEAD..HEAD is an
        # empty diff, which is all a head-only gate needs.
        args=(diff
          --report "$REPORT"
          --base-ref "${BASE_SHA:-HEAD}"
          --fail-under-lines "$FAIL_UNDER_LINES"
          -o json)
        # Mirror the parse-affecting flags from the comment diff so the gated
        # percentage is the one the comment reported. patchcov gates on the head
        # report AFTER `--ignore-filename-regex`, so this one needs it too.
        if [ -n "$STRIP_PREFIX" ]; then
          args+=(--strip-prefix "$STRIP_PREFIX")
        fi
        if [ -n "$IGNORE_FILENAME_REGEX" ]; then
          args+=("--ignore-filename-regex=$IGNORE_FILENAME_REGEX")
        fi
        if [ -n "$REPORT_FORMAT" ]; then
          args+=(--report-format "$REPORT_FORMAT")
        fi
        patchcov "${args[@]}" > /dev/null

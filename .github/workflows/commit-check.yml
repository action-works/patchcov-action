name: Commit Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The event a merge queue runs the required checks on (#76). `Validate Commit
  # Messages` is one of them, and without this it never reports for the queue's commit.
  merge_group:

jobs:
  check-commits:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: action-works/omni-dev-commit-check@v1
        with:
          command: lint
          verbose: true

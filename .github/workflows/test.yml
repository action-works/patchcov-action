name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The event a merge queue runs the required checks on (#76). `Shell scripts` is one of
  # them, and without this it never reports for the queue's commit.
  merge_group:

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint the scripts
        run: shellcheck -x scripts/*.sh tests/*.sh

      - name: Test combine-shards.sh
        run: bash tests/combine-shards.test.sh

      - name: Test patchcov install contract
        run: bash tests/patchcov-install.test.sh

      - name: Test legacy configuration warnings
        run: bash tests/check-legacy-config.test.sh

      - name: Test patchcov-asset.sh
        run: bash tests/patchcov-asset.test.sh

      - name: Test the platform step of action.yml
        run: bash tests/platform-step.test.sh

      - name: Test the download step of action.yml
        run: bash tests/download-step.test.sh

      - name: Test the patchcov version step of action.yml
        run: bash tests/print-version-step.test.sh

      - name: Test the resolve-version step of action.yml
        run: bash tests/resolve-version-step.test.sh

      - name: Test find-baseline.sh
        run: bash tests/find-baseline.test.sh

      - name: Test the baseline steps of action.yml
        run: bash tests/baseline-steps.test.sh

      - name: Test the cargo llvm-cov report steps of action.yml
        run: bash tests/llvm-cov-ignore-steps.test.sh

      - name: Test expected-baseline.sh
        run: bash tests/expected-baseline.test.sh

      - name: Test baseline-lib.sh
        run: bash tests/baseline-lib.test.sh

      - name: Test the input-reading steps of action.yml
        run: bash tests/input-steps.test.sh

      - name: Test the merge-base worktree of the recompute step
        run: bash tests/recompute-worktree.test.sh

      - name: Test job-errors.sh
        run: bash tests/job-errors.test.sh

      - name: Test run-jobs.sh
        run: bash tests/run-jobs.test.sh

      - name: Test assert-lib.sh
        run: bash tests/assert-lib.test.sh

      - name: Test prepare-shard-crate.sh
        run: bash tests/prepare-shard-crate.test.sh

      - name: Test fat-mode fixture preparation
        run: bash tests/prepare-fat-crate.test.sh

      - name: Test check-deprecated-flags.sh
        run: bash tests/check-deprecated-flags.test.sh

      - name: Test assert-patchcov-version.sh
        run: bash tests/assert-patchcov-version.test.sh

      - name: Test install-cache.sh
        run: bash tests/install-cache.test.sh

      - name: Test llvm-tool-shim.sh
        run: bash tests/llvm-tool-shim.test.sh

      - name: Test test-lib.sh
        run: bash tests/test-lib.test.sh

      - name: Test step-lib.sh
        run: bash tests/step-lib.test.sh

      - name: Test check-run-expressions.sh
        run: bash tests/check-run-expressions.test.sh

      # The merge queue's required checks (#76): the gate script, that `ci-gate` needs
      # every job of integration.yml, and that the workflows a required check comes from
      # run on `merge_group`.
      - name: Test the merge queue's workflow wiring and ci-gate.sh
        run: bash tests/merge-queue.test.sh

      # Dependabot's commit messages must pass the required commit check, and one cannot be
      # fixed after the bot has written it (#58): the config's prefix is held to the
      # project's types and scopes and to the subject length.
      - name: Test the Dependabot config
        run: bash tests/dependabot-config.test.sh

      # Not a lint of the scripts, but it needs no setup and belongs on every pull
      # request: it fails when action.yml (or a script it ships) passes patchcov a
      # flag patchcov has deprecated, before a major release removes it.
      - name: Check the action passes no deprecated patchcov flag
        run: bash tests/check-deprecated-flags.sh

      # The runner replaces every expression in a `run:` body with its value before the
      # shell parses the script, so a value that holds shell syntax runs as shell (#39).
      # Values reach a script through `env:`. This fails when a new expression appears in
      # a body of action.yml, before a caller's untrusted value can reach one, and in a body
      # of this repository's own workflows (#73), which run on `pull_request` and `push`:
      # `github.head_ref`, a pull request's title or a `workflow_dispatch` input written
      # into a `run:` body would be a command injection there.
      - name: Check no run body of the action or a workflow holds an expression
        run: |
          # GitHub reads both extensions. With no `*.yaml` workflow that glob has to vanish
          # (nullglob), not reach the check as a file that does not exist.
          shopt -s nullglob
          bash tests/check-run-expressions.sh action.yml .github/workflows/*.yml .github/workflows/*.yaml

name: PR paths

# Runs the action itself (`uses: ./`) down the paths that only a pull request or a
# push to main takes, which integration.yml cannot reach: the sticky comment, the
# baseline publish and the baseline hit, and the merge-base worktree recompute.
# Each scenario's outcome is asserted at the end of its job; the scenarios are
# `continue-on-error` so one regression does not hide the rest.
#
#   publish       push to main: publishes the combined sharded report as the
#                 `coverage-baseline` artifact.
#   pull-request  a pull request: the sticky comment, the baseline lookup (a hit or
#                 a miss, both are legitimate), the patch gate and its ordering,
#                 and `ignore-filename-regex` reaching the comment, the gate and the
#                 baseline side of the comparison (P10).
#   recompute     a pull request, fat mode: the baseline rebuilt at the merge-base
#                 in a git worktree, and `llvm-cov-ignore-filename-regex` reaching the
#                 report that recompute builds.
#
# Why this is its own workflow and not more jobs in integration.yml:
#   - `pull_request` is filtered to the paths below, so a pull request that cannot
#     change the action gets no comment. `push` has NO filter: every main commit
#     must publish a baseline, or a later pull request merge-based on it misses.
#   - integration.yml's jobs that run the action stay at `contents: read` (its one
#     job with `actions: read` only reads logs), so their evidence that the miss
#     path needs no `actions: read` stays valid, and `pull-requests: write` is
#     granted only to the job that posts the comment.
#   - Two `coverage-baseline` uploads in one run conflict, and integration.yml's
#     thin matrix has two legs.
#
# Rules that keep these tests honest (integration.yml has the others):
#   - Every scenario uses the same report basename, in its own directory. The
#     action looks for `baseline/<basename of report>`, so a different basename
#     would silently never find the baseline that was published.
#   - Scenarios share the workspace and the action writes some outputs to fixed
#     names, so each scenario's outputs are moved to out/<id>/ before the next.
#   - Whether a baseline is found is NOT assumed. A hit needs a published baseline
#     for the pull request's merge-base, which the first pull request after this
#     workflow lands cannot have, and a recent merge-base may still be running. The
#     lookup is asserted against what the Actions API says should be found.
#   - The lookup falls back to the nearest first-parent ancestor of the merge-base that
#     has a baseline (`baseline-ancestor-depth`, 10 by default), so a hit may be a
#     baseline for an older commit and a miss means none within reach. What it should
#     find is asked of tests/expected-baseline.sh, which reads the Actions API, and
#     compared with the baseline's own `TN:` line, which names the commit it was
#     published for. P7 and P8 make the walk deterministic: their base is a commit no
#     run was ever for, so the exact lookup (P8, depth 0) must miss whatever main holds,
#     and P7 can only be answered by an ancestor. The recompute job turns the walk off,
#     because its synthetic base has no baseline by design.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - action.yml
      - scripts/**
      - tests/**
      - .github/workflows/pr-paths.yml

permissions:
  contents: read

concurrency:
  # A push gets a group of its own. Sharing one `refs/heads/main` group would let
  # a burst of merges cancel a pending run, and a main commit without a finished
  # run has no baseline for a later pull request to download.
  group: pr-paths-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: Publish the baseline (push to main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write fixtures
        run: bash tests/write-pr-fixtures.sh baseline

      # Sharded on purpose: what is published is the combined report, so this is
      # the publish half of the sharded loop (a later pull request is the other).
      - name: 'B1. Sharded run that publishes the baseline'
        id: b1
        uses: ./
        continue-on-error: true
        with:
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/b1/coverage-head.lcov
          fail-under-lines: 40
          comment: false
          upload-artifacts: false
          publish-baseline: true
          baseline-workflow: pr-paths.yml

      # An artifact of this run is downloaded with the runtime token, so this
      # needs no permission beyond the workflow's.
      - name: Download what was published
        id: published
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-baseline
          path: out/published

      - name: Assert the baseline was published
        env:
          B1: ${{ steps.b1.outcome }}
          PUBLISHED: ${{ steps.published.outcome }}
          VERSION: ${{ steps.b1.outputs.version }}
        run: |
          status=0
          source tests/assert-lib.sh

          check "B1. sharded run that publishes" success "$B1"
          check "B1. the published artifact exists and downloads" success "$PUBLISHED"

          published=out/published/coverage-head.lcov
          assert "the artifact holds the combined report, byte for byte" \
            cmp "$published" out/b1/coverage-head.lcov

          # 2 shards x 2 files. A bare `cat` of the shards would glue a record's
          # `end_of_record` onto the next shard's first line.
          check "the combined report has a record per shard and file" 4 "$(grep -c '^SF:' "$published")"
          check "every record is closed on a line of its own" 4 "$(grep -c '^end_of_record$' "$published")"
          # What a later pull request checks to know the baseline is the one for
          # its merge-base.
          check "every record names the commit it was published for" 4 "$(grep -cx "TN:$GITHUB_SHA" "$published")"

          bash tests/assert-patchcov-version.sh "$VERSION" || status=1
          exit "$status"

  pull-request:
    name: Sticky comment, baseline lookup and patch gate (pull request)
    # A fork's token cannot write the comment, and neither can Dependabot's: it
    # gets a read-only token whatever `permissions` asks for. `recompute` below
    # writes nothing, so it still runs for Dependabot, which is the likeliest
    # author of a change to the actions this workflow uses.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Exactly what the README tells a caller to grant, so a permission the action
    # needs and the README does not mention fails here. `actions: read` is NOT
    # granted: this repository is public, so it only shows that public callers
    # do not need it, not that a private one does not.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The head fixtures cover 80% of the lines this pull request "adds" (the
      # union of the shards; each alone covers under 60%), so a patch gate of 70
      # passes and one of 90 fails. A baseline from main, if one is found, was
      # written by `write-pr-fixtures.sh baseline` and differs from this.
      - name: Write fixtures
        run: bash tests/write-pr-fixtures.sh head

      # A commit that no run was ever for: the merge-base's child, with the merge-base's own
      # tree, so a diff from it is the merge-base's and patchcov reads it as any base. It is
      # made with commit-tree, so it is on no branch and nothing else can see it. P7 and P8
      # take it as `base-ref`.
      - name: Make a commit that no baseline was published for
        id: nobase
        run: |
          mb="$(git merge-base origin/main HEAD)"
          sha="$(git -c user.name=integration-test -c user.email=integration-test@invalid \
            commit-tree "$mb^{tree}" -p "$mb" -m 'test: a commit no baseline was published for')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # What the lookup should find, asked now and again at the end (the last step). The lookups
      # run in between, and a baseline can be published meanwhile (the `push` run for the
      # merge-base finishing), which a lookup may or may not have seen. Only the span between
      # the two answers is a fair expectation, so the last step holds each lookup to that.
      - name: Ask the Actions API what the lookups should find (before the scenarios)
        env:
          GH_TOKEN: ${{ github.token }}
          NOBASE_SHA: ${{ steps.nobase.outputs.sha }}
        run: |
          mb="$(git merge-base origin/main HEAD)"
          # Redirected, not piped to tee: without pipefail a failing call would not fail the step.
          bash tests/expected-baseline.sh pr-paths.yml coverage-baseline "$mb" > out/expected-before-p1.txt
          bash tests/expected-baseline.sh pr-paths.yml coverage-baseline "$NOBASE_SHA" > out/expected-before-p7.txt
          echo "P1 (from the merge-base): $(cat out/expected-before-p1.txt)"
          echo "P7 (from a commit after it): $(cat out/expected-before-p7.txt)"

      # A comment left by an earlier run (a push, or a re-run) must not be able to
      # stand in for one this run is meant to post.
      - name: Clear the comment from an earlier run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rc=0
          bash tests/read-sticky-comment.sh --delete integration-test out/comment-before.md || rc=$?
          # 3: there was none. 4: more than one, now all deleted.
          case "$rc" in 0 | 3 | 4) ;; *) exit "$rc" ;; esac

      # P1 and P2 differ only in `fail-under-patch`. P1, P2 and P3 share one comment
      # header, and on a miss all three render the same comment, so P2's and P3's
      # are read back and deleted before the next scenario: a P1 that stopped
      # posting could not hide behind them. P1 runs last, so the comment left on
      # the pull request is the passing one. The report differs only in directory,
      # which is bookkeeping: the basename must stay equal.
      - name: 'P2. Patch gate above the patch coverage'
        id: p2
        uses: ./
        continue-on-error: true
        with:
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/p2/coverage-head.lcov
          fail-under-lines: 40
          fail-under-patch: 90
          all-files: true
          comment-header: integration-test
          upload-artifacts: false
          publish-baseline: true
          baseline-workflow: pr-paths.yml

      # The gate runs after the comment, so the comment is there although P2 fails.
      - name: Read back and clear the comment after P2
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash tests/read-sticky-comment.sh --delete integration-test out/comment-p2.md

      - name: Move P2 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh p2

      # Control for the baseline lookup: only the artifact's name differs, so
      # nothing can be found. A miss is a warning, not a failure, and the comment
      # then has no deltas.
      - name: 'P3. A baseline artifact name that does not exist'
        id: p3
        uses: ./
        continue-on-error: true
        with:
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/p3/coverage-head.lcov
          fail-under-lines: 40
          fail-under-patch: 70
          all-files: true
          comment-header: integration-test
          upload-artifacts: false
          publish-baseline: true
          baseline-artifact-name: coverage-baseline-absent
          baseline-workflow: pr-paths.yml

      - name: Read back and clear the comment after P3
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash tests/read-sticky-comment.sh --delete integration-test out/comment-p3.md

      - name: Move P3 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh p3

      # Control for the comment: `comment: false`, under a header of its own. The
      # header differs only so that a comment it posted anyway could not be
      # mistaken for P1's.
      - name: 'P4. Comment off'
        id: p4
        uses: ./
        continue-on-error: true
        with:
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/p4/coverage-head.lcov
          fail-under-lines: 40
          fail-under-patch: 70
          all-files: true
          comment: false
          comment-header: integration-test-off
          upload-artifacts: false
          publish-baseline: true
          baseline-workflow: pr-paths.yml

      - name: Move P4 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh p4

      # The walk. P7's base is a commit no run was ever for (its parent is the merge-base),
      # so a baseline can only come from an ancestor. Whether one exists depends on what main
      # has published, so the lookup is held to the Actions API, as P1's is.
      - name: 'P7. A base commit with no baseline of its own'
        id: p7
        uses: ./
        continue-on-error: true
        with:
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/p7/coverage-head.lcov
          base-ref: ${{ steps.nobase.outputs.sha }}
          fail-under-lines: 40
          fail-under-patch: 70
          all-files: true
          comment: false
          upload-artifacts: false
          publish-baseline: true
          baseline-workflow: pr-paths.yml

      - name: Move P7 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh p7

      # Control for P7: only the depth differs, and with it off the commit's own baseline is
      # the only one that counts. It has none, so this misses on every run, whatever main holds.
      - name: 'P8. The same, without the walk'
        id: p8
        uses: ./
        continue-on-error: true
        with:
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/p8/coverage-head.lcov
          base-ref: ${{ steps.nobase.outputs.sha }}
          baseline-ancestor-depth: 0
          fail-under-lines: 40
          fail-under-patch: 70
          all-files: true
          comment: false
          upload-artifacts: false
          publish-baseline: true
          baseline-workflow: pr-paths.yml

      - name: Move P8 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh p8

      # A workflow the API does not know, as one whose file is not on main yet is. That used
      # to fail the step with `Not Found`; it must be a miss with a warning. The permissions
      # are the README's, so this also shows the miss needs nothing more. P1 is the control:
      # only the workflow's name differs.
      - name: 'P9. A baseline workflow that does not exist'
        id: p9
        uses: ./
        continue-on-error: true
        with:
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/p9/coverage-head.lcov
          fail-under-lines: 40
          fail-under-patch: 70
          all-files: true
          comment: false
          upload-artifacts: false
          publish-baseline: true
          baseline-workflow: no-such-workflow.yml

      - name: Move P9 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh p9

      # Everything on: the sharded report, both gates, the comment, the baseline
      # lookup, and `publish-baseline: true`, which on a pull request must publish
      # nothing.
      - name: 'P1. Everything on'
        id: p1
        uses: ./
        continue-on-error: true
        with:
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/p1/coverage-head.lcov
          fail-under-lines: 40
          fail-under-patch: 70
          all-files: true
          comment-header: integration-test
          upload-artifacts: false
          publish-baseline: true
          baseline-workflow: pr-paths.yml

      - name: Read back the comment after P1
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash tests/read-sticky-comment.sh integration-test out/comment-p1.md

      - name: Move P1 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh p1

      # `ignore-filename-regex` must reach the patch gate as well as the comment, or the
      # gate measures files the comment does not show. A second file joins the patch with
      # every added line uncovered: the patch is 8 of 20 lines (40%), and 8 of 10 (80%)
      # once that file is filtered out, so a gate of 70 tells the two apart. Emptying the
      # patch instead would prove nothing: patchcov lets a patch with no measured line
      # through the gate, which is vacuous. The file and its report come after P1 to P4
      # have run, so they do not see it, and P5 and P6 leave no comment to read back.
      - name: Add a second file to the patch
        run: bash tests/write-pr-fixtures.sh extra

      - name: 'P5. The patch gate with the second file filtered out'
        id: p5
        uses: ./
        continue-on-error: true
        with:
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/p5/coverage-head.lcov
          fail-under-lines: ''
          fail-under-patch: 70
          ignore-filename-regex: 'patch-extra\.txt'
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: pr-paths.yml

      - name: Move P5 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh p5

      # Control for P5: only the filter differs, so the gate sees the 40% and fails.
      # The line gate is off in both, so the patch gate is the only one that can fail.
      - name: 'P6. The same without the filter'
        id: p6
        uses: ./
        continue-on-error: true
        with:
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/p6/coverage-head.lcov
          fail-under-lines: ''
          fail-under-patch: 70
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: pr-paths.yml

      - name: Move P6 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh p6

      # `ignore-filename-regex` on the BASELINE side (#49). P5 and P6 filter a file that only the
      # head has, so even on a hit the downloaded baseline had nothing to drop and the filter was
      # never shown reaching it. LICENSE is in both reports (3 of 4 lines covered in the baseline,
      # 2 of 4 in the head, and no diff touches it), and `all-files` shows what it flips, so
      # filtering it has to take it out of the totals, the per-file deltas and the indirect
      # changes alike: that is the filter applied to the downloaded baseline as well as the head.
      # The gates are off, so only the comparison is in play. P1 is its control for the filter
      # (`all-files`, no filter, and it names LICENSE); it ran before the second file was added,
      # so its head report lacks shard-3 and the two differ by that as well, which no assertion
      # compares across them.
      - name: 'P10. LICENSE filtered out, every file shown'
        id: p10
        uses: ./
        continue-on-error: true
        with:
          run-coverage: false
          shard-reports: shards/shard-*.lcov
          report: out/p10/coverage-head.lcov
          fail-under-lines: ''
          fail-under-patch: ''
          all-files: true
          ignore-filename-regex: 'LICENSE'
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: pr-paths.yml

      - name: Move P10 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh p10

      - name: Assert every outcome
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          P1: ${{ steps.p1.outcome }}
          P2: ${{ steps.p2.outcome }}
          P3: ${{ steps.p3.outcome }}
          P4: ${{ steps.p4.outcome }}
          P5: ${{ steps.p5.outcome }}
          P6: ${{ steps.p6.outcome }}
          P7: ${{ steps.p7.outcome }}
          P8: ${{ steps.p8.outcome }}
          P9: ${{ steps.p9.outcome }}
          P10: ${{ steps.p10.outcome }}
          NOBASE_SHA: ${{ steps.nobase.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PATCH_PERCENT: ${{ steps.p1.outputs.patch-percent }}
          P5_PATCH_PERCENT: ${{ steps.p5.outputs.patch-percent }}
          LINE_PERCENT: ${{ steps.p1.outputs.line-percent }}
          COMMENT_PATH: ${{ steps.p1.outputs.comment-path }}
          VERSION: ${{ steps.p1.outputs.version }}
        run: |
          status=0
          source tests/assert-lib.sh

          # Both are called through `assert`. Command substitution ignores trailing
          # newlines, which the comment may or may not keep.
          # shellcheck disable=SC2329
          same() { [ "$(cat "$1")" = "$(cat "$2")" ]; }
          # shellcheck disable=SC2329
          differ() { ! same "$@"; }
          # A missing file is not "absent": grep exits 2 for it, and `!` would turn that
          # into a pass.
          # shellcheck disable=SC2329
          absent() { [ -s "$2" ] && ! grep -qF -- "$1" "$2"; }
          # Lines of <file> whose covered state differs between two reports.
          flipped() { # <before> <after> <file>
            awk -F'[:,]' -v want="$3" '
              FNR == 1 { n++ }
              /^SF:/ { in_file = (substr($0, 4) ~ ("/" want "$")) }
              $1 == "DA" && in_file {
                k = n SUBSEP $2
                if (!(k in h) || $3 + 0 > h[k]) h[k] = $3 + 0
                seen[$2] = 1
              }
              END {
                for (l in seen)
                  if (((1 SUBSEP l) in h) && ((2 SUBSEP l) in h) && ((h[1 SUBSEP l] > 0) != (h[2 SUBSEP l] > 0))) c++
                print c + 0
              }' "$1" "$2"
          }

          # An lcov report without the records of one source file: a record runs from its first
          # line (`TN:` or `SF:`) to `end_of_record`, and the last has no newline after it.
          without_record() { # <file> <lcov>
            awk -v want="$1" '
              { buf = buf $0 "\n" }
              /^SF:/ { drop = (substr($0, 4) ~ ("/" want "$")) }
              /^end_of_record/ { if (!drop) printf "%s", buf; buf = ""; drop = 0 }
              END { if (buf != "" && !drop) printf "%s", buf }' "$2"
          }

          # distance_of, tn_of and check_note, which the baseline checks below use. They need
          # `status`, `check` and `assert` from above.
          source tests/baseline-lib.sh

          MB="$(git merge-base origin/main HEAD)"

          check "P1. everything on" success "$P1"
          check "P2. patch gate above the patch coverage" failure "$P2"
          check "P3. a baseline artifact name that does not exist" success "$P3"
          check "P4. comment off" success "$P4"
          check "P5. the patch gate with the second file filtered out" success "$P5"
          check "P6. the same without the filter" failure "$P6"
          check "P7. a base commit with no baseline of its own" success "$P7"
          check "P8. the same, without the walk" success "$P8"
          check "P9. a baseline workflow that does not exist" success "$P9"

          # The patch is the 10 lines of patch-fixture.txt, 8 of them covered by
          # the union of the shards. Each shard alone is under the gate P1 passes. P7 and P8
          # diff from a commit with the merge-base's tree, and P9 only looks elsewhere. (P5 and
          # P6 add a second file to the patch, and are asserted on their own below.)
          for s in p1 p2 p3 p4 p7 p8 p9; do
            assert "${s^^}: patch coverage is the shards' union (80%)" \
              jq -e '.patch_coverage.percent == 80 and .patch_coverage.total == 10' "out/$s/coverage.json"
          done
          # jq keeps a literal such as 80.0, so compare as numbers.
          check "P1: the patch-percent output is 80" true "$(jq -n --arg p "$PATCH_PERCENT" '($p | tonumber) == 80')"
          check "P1: the comment-path output" coverage.md "$COMMENT_PATH"

          # P2 stopped at the patch gate: the diff was built and the comment posted.
          # The line gate comes after the patch gate and P1 passes it.
          assert "P2: stopped at the gate: coverage.md written" test -s out/p2/coverage.md
          assert "P2: stopped at the gate: the comment was already posted" test -s out/comment-p2.md
          assert "P2: the comment is the rendered diff" same out/comment-p2.md out/p2/coverage.md

          # The sticky comment: posted by P1 (the only one there, as the others were
          # cleared) and equal to what it rendered.
          assert "P1: the sticky comment is the rendered diff" same out/comment-p1.md out/p1/coverage.md
          # An earlier push's comment names another commit, so it cannot pass this.
          assert "P1: the comment is for this commit" grep -qF "${HEAD_SHA:0:7}" out/comment-p1.md
          assert "P1: the comment names the merge-base" grep -qF "${MB:0:7}" out/comment-p1.md

          # P3 is the miss control.
          assert "P3: no baseline was found" test ! -e out/p3/baseline/coverage-head.lcov
          assert "P3: the comment is the rendered diff" same out/comment-p3.md out/p3/coverage.md
          assert "P3: without a baseline there is no project_delta" \
            jq -e '.project_delta == null' out/p3/coverage.json
          assert "P3: the comment says there is no baseline" grep -q 'No baseline available' out/p3/coverage.md

          # P4: nothing under its header, though it ran exactly as P1 did.
          rc=0
          bash tests/read-sticky-comment.sh --delete integration-test-off out/comment-p4.md || rc=$?
          check "P4: no comment under its header (read-sticky-comment exit status)" 3 "$rc"

          # P5 and P6: `ignore-filename-regex` and the patch gate. patch-fixture.txt has 8 of
          # its 10 added lines covered and patch-extra.txt none, so the patch is 40% of 20
          # lines until the filter takes the second file out and leaves 80% of 10.
          assert "P5: the comment diff dropped the filtered file: 80% of 10 lines" \
            jq -e '.patch_coverage.percent == 80 and .patch_coverage.total == 10' out/p5/coverage.json
          assert "P5: the excluded file is absent from measured patch files" \
            jq -e '[.patch_coverage.files[].path] | index("patch-extra.txt") == null' out/p5/coverage.json
          assert "P5: the exclusion notice identifies the filtered file" \
            jq -e '.excluded_files.touched | index("patch-extra.txt") != null' out/p5/coverage.json
          assert "P5: the comment explains the exclusion" \
            grep -qF 'Excluded files touched by this diff' out/p5/coverage.md
          # The gate passed at 70, which it does only over the 80%, so the gated figure is
          # the commented one. jq keeps a literal such as 80.0, so compare as numbers.
          check "P5: the patch-percent output is 80" true "$(jq -n --arg p "$P5_PATCH_PERCENT" '($p | tonumber) == 80')"
          # P6 stopped at the patch gate: the diff was rendered, over both files.
          assert "P6: stopped at the gate: coverage.md written" test -s out/p6/coverage.md
          assert "P6: without the filter the patch is 40% of 20 lines" \
            jq -e '.patch_coverage.percent == 40 and .patch_coverage.total == 20' out/p6/coverage.json
          assert "P6: the comment names the file P5 filtered out" grep -qF patch-extra.txt out/p6/coverage.md

          # P10: the filter on the baseline side. Hit or miss is whatever the lookup found, which
          # the next step holds to the Actions API as it does P1's; either way it must be
          # internally sound.
          check "P10. LICENSE filtered out, every file shown" success "$P10"
          base10=out/p10/baseline/coverage-head.lcov
          head10=out/p10/coverage-head.lcov
          # shellcheck disable=SC2016 # `$v`, `$a` and `$b` are jq's, not the shell's
          if [ -s "$base10" ]; then
            echo "note - P10 found a baseline: the hit path ran"
            tn10="$(tn_of "$base10")"
            check "P10: the baseline names one commit" 1 "$(printf '%s\n' "$tn10" | grep -c .)"
            check_note P10 "$MB" "$tn10" out/p10/coverage.md
            # The totals are recomputed from the reports with LICENSE's records removed, as P1's
            # are from the whole reports, so the figures survive an edit of the fixtures.
            without_record LICENSE "$base10" > out/p10/baseline-without-license.lcov
            without_record LICENSE "$head10" > out/p10/head-without-license.lcov
            before10="$(bash tests/lcov-percent.sh out/p10/baseline-without-license.lcov)"
            after10="$(bash tests/lcov-percent.sh out/p10/head-without-license.lcov)"
            assert "P10: total_before is the baseline's coverage with LICENSE removed" \
              jq -e --argjson v "$before10" '((.project_delta.total_before - $v) | fabs) < 0.02' out/p10/coverage.json
            assert "P10: total_after is the head report's coverage with LICENSE removed" \
              jq -e --argjson v "$after10" '((.project_delta.total_after - $v) | fabs) < 0.02' out/p10/coverage.json
            # The control: with LICENSE in, the same two reports give other figures, so the
            # two assertions above are not ones an unfiltered baseline would also pass.
            assert "P10: with LICENSE in, the baseline's coverage is another figure" \
              jq -en --argjson a "$(bash tests/lcov-percent.sh "$base10")" --argjson b "$before10" '(($a - $b) | fabs) > 0.02'
            assert "P10: with LICENSE in, the head report's coverage is another figure" \
              jq -en --argjson a "$(bash tests/lcov-percent.sh "$head10")" --argjson b "$after10" '(($a - $b) | fabs) > 0.02'
            assert "P10: LICENSE is not among the per-file deltas" \
              jq -e '[.project_delta.files[].path] | index("LICENSE") == null' out/p10/coverage.json
            assert "P10: it has no indirect change, though its coverage flips between the reports" \
              jq -e '(.indirect_changes.newly_covered + .indirect_changes.newly_uncovered) == 0 and ([(.indirect_changes.lines // [])[].path] | index("LICENSE") == null)' out/p10/coverage.json
            assert "P10: the comment names nothing from LICENSE" absent LICENSE out/p10/coverage.md
          else
            # Nothing to filter on the baseline side, so the filter is not shown here; the run
            # must still be sound.
            echo "note - P10 found no baseline: the miss path ran"
            assert "P10: without a baseline there is no project_delta" \
              jq -e '.project_delta == null' out/p10/coverage.json
            assert "P10: nor indirect changes" jq -e '.indirect_changes == null' out/p10/coverage.json
            assert "P10: the comment says there is no baseline" grep -q 'No baseline available' out/p10/coverage.md
          fi

          # P8 is P7 with the walk off, from a commit no run was ever for: no baseline of its
          # own, so a miss on every run, whatever main has published.
          assert "P8: no baseline was found" test ! -e out/p8/baseline/coverage-head.lcov
          assert "P8: without a baseline there is no project_delta" \
            jq -e '.project_delta == null' out/p8/coverage.json
          assert "P8: the comment says there is no baseline" grep -q 'No baseline available' out/p8/coverage.md
          assert "P8: and makes no claim about one" \
            test "$(grep -c 'before the merge-base, which has none' out/p8/coverage.md)" = 0

          # P9 names a workflow the API does not know: a miss, on every run.
          assert "P9: no baseline was found" test ! -e out/p9/baseline/coverage-head.lcov
          assert "P9: without a baseline there is no project_delta" \
            jq -e '.project_delta == null' out/p9/coverage.json
          assert "P9: the comment says there is no baseline" grep -q 'No baseline available' out/p9/coverage.md

          # P7: whatever it found came from the walk. Hit or miss is checked against the
          # Actions API in the next step; here a hit must be internally sound.
          base=out/p7/baseline/coverage-head.lcov
          if [ -s "$base" ]; then
            echo "note - P7 found a baseline: the walk found an ancestor's"
            tn="$(tn_of "$base")"
            check "P7: the baseline names one commit" 1 "$(printf '%s\n' "$tn" | grep -c .)"
            assert "P7: that commit is on the first-parent line before the base" \
              test -n "$(distance_of "$NOBASE_SHA" "$tn")"
            assert "P7: the walk went back at least one commit: the base itself has no baseline" \
              test "$(distance_of "$NOBASE_SHA" "$tn")" -ge 1
            check_note P7 "$NOBASE_SHA" "$tn" out/p7/coverage.md
            assert "P7: with a baseline, the comment has deltas" \
              jq -e '.project_delta.total_after | type == "number"' out/p7/coverage.json
            assert "P7: and differs from the one without" differ out/p7/coverage.md out/p8/coverage.md
          else
            echo "note - P7 found no baseline: nothing within reach"
            assert "P7: without a baseline there is no project_delta" \
              jq -e '.project_delta == null' out/p7/coverage.json
            assert "P7: the comment says there is no baseline" grep -q 'No baseline available' out/p7/coverage.md
          fi

          # P1's baseline, if the lookup found one. Hit or miss is checked against
          # the Actions API in the next step; here a hit must be internally sound.
          base=out/p1/baseline/coverage-head.lcov
          head=out/p1/coverage-head.lcov
          # shellcheck disable=SC2016 # `$v` and `$l` are jq's, not the shell's
          if [ -s "$base" ]; then
            echo "note - P1 found a baseline: the hit path ran"
            # The merge-base's own, or the nearest ancestor's that has one (the next step holds
            # the choice to the Actions API). The comment says which.
            tn="$(tn_of "$base")"
            check "P1: the baseline names one commit" 1 "$(printf '%s\n' "$tn" | grep -c .)"
            check_note P1 "$MB" "$tn" out/comment-p1.md
            before="$(bash tests/lcov-percent.sh "$base")"
            after="$(bash tests/lcov-percent.sh "$head")"
            assert "P1: total_before is the baseline's own coverage" \
              jq -e --argjson v "$before" '((.project_delta.total_before - $v) | fabs) < 0.01' out/p1/coverage.json
            assert "P1: total_after is the head report's coverage" \
              jq -e --argjson v "$after" '((.project_delta.total_after - $v) | fabs) < 0.01' out/p1/coverage.json
            check "P1: the line-percent output is total_after" \
              "$(jq -r '.project_delta.total_after' out/p1/coverage.json)" "$LINE_PERCENT"
            # LICENSE is in no diff, so only all-files shows its flipped lines.
            check "P1: indirect changes are the flipped lines of LICENSE" \
              "$(flipped "$base" "$head" LICENSE)" \
              "$(jq -r '.indirect_changes.newly_covered + .indirect_changes.newly_uncovered' out/p1/coverage.json)"
            assert "P1: the comment differs from the one without a baseline" differ out/comment-p1.md out/comment-p3.md
            # P10 is P1 with LICENSE filtered out, so P1 is its control and must name it.
            assert "P1: the per-file deltas name LICENSE, which P10 filters out" \
              jq -e '[.project_delta.files[].path] | index("LICENSE") != null' out/p1/coverage.json
            assert "P1: the comment names LICENSE, which P10 filters out" grep -qF LICENSE out/p1/coverage.md
          else
            echo "note - P1 found no baseline: the miss path ran"
            assert "P1: without a baseline there is no project_delta" \
              jq -e '.project_delta == null' out/p1/coverage.json
            check "P1: the line-percent output is empty without a baseline" "" "$LINE_PERCENT"
            assert "P1: the comment says there is no baseline" grep -q 'No baseline available' out/p1/coverage.md
          fi

          bash tests/assert-patchcov-version.sh "$VERSION" || status=1
          exit "$status"

      # What only the Actions API knows. The token is the job's own, without
      # `actions: read`; reading a public repository's runs needs none.
      - name: Check the baseline lookup and the publish against the Actions API
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOBASE_SHA: ${{ steps.nobase.outputs.sha }}
        run: |
          status=0
          source tests/assert-lib.sh

          # `publish-baseline: true` ran on a pull request, in every scenario.
          published="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "coverage-baseline")] | length')"
          check "a pull-request run publishes no baseline" 0 "$published"

          # What the lookup should have found, from tests/expected-baseline.sh: the nearest
          # of the start commit and its first-parent ancestors (within `baseline-ancestor-depth`,
          # the action's default here) with a successful run of this workflow and a live
          # baseline artifact. Any such run counts, not the newest, because a run without the
          # artifact must not hide one with it. There is deliberately no `event` or `branch`
          # filter, because the action passes none. The API is asked here and was asked before
          # the scenarios (the first step after the throwaway commit), and the lookup is held to
          # the span between the two answers: a baseline published meanwhile may or may not have
          # been seen. `held_to_the_api` is tests/baseline-lib.sh's.
          source tests/baseline-lib.sh

          MB="$(git merge-base origin/main HEAD)"
          held_to_the_api "P1" pr-paths.yml coverage-baseline "$MB" out/p1/baseline/coverage-head.lcov out/expected-before-p1.txt
          # P10 looks from the same merge-base later in the run, so the same snapshot bounds it
          # (a baseline only appears). Without this a P10 that missed while P1 hit would pass on
          # the weaker miss path, with the baseline side of the filter not shown.
          held_to_the_api "P10" pr-paths.yml coverage-baseline "$MB" out/p10/baseline/coverage-head.lcov out/expected-before-p1.txt
          # P7's base has no baseline of its own, so a hit is at least one commit back, and a
          # miss means none within reach.
          held_to_the_api "P7" pr-paths.yml coverage-baseline "$NOBASE_SHA" out/p7/baseline/coverage-head.lcov out/expected-before-p7.txt
          exit "$status"

  recompute:
    name: Merge-base recompute (fat mode)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The merge-base worktree is checked out from git, so the base must be a
      # commit that holds a crate. The pull request's own history has none, so the
      # job commits one (never pushed) and then the head over it, and passes the
      # first as `base-ref`. The numbers are then the job's own and do not depend
      # on what main happens to hold.
      - name: Commit a base and a head around the delta crate
        id: history
        run: |
          if [ -e Cargo.toml ] || [ -e src ]; then
            echo "::error::Cargo.toml or src/ already exists at the repository root; the fixture would overwrite it"
            exit 1
          fi
          mkdir -p src out/r1 out/r2 out/r3
          cp tests/fixtures/delta-crate/Cargo.toml Cargo.toml
          cp tests/fixtures/delta-crate/lib.base.rs src/lib.rs
          cp tests/fixtures/delta-crate/ignored.rs src/ignored.rs
          git add Cargo.toml src/lib.rs src/ignored.rs
          git -c user.name=integration-test -c user.email=integration-test@invalid \
            commit -q -m 'test: add the delta crate (base)'
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cp tests/fixtures/delta-crate/lib.head.rs src/lib.rs
          git -c user.name=integration-test -c user.email=integration-test@invalid \
            commit -q -am 'test: change the delta crate (head)'

      # No baseline artifact exists for the synthetic base, so the download warns
      # and the worktree recompute has to produce the baseline. The walk is off: the
      # synthetic base has this pull request's commits and then main's behind it, so with
      # it on the lookup could reach a baseline main published and never recompute.
      - name: 'R1. Baseline recomputed at the merge-base'
        id: r1
        uses: ./
        continue-on-error: true
        with:
          base-ref: ${{ steps.history.outputs.base }}
          baseline-ancestor-depth: 0
          report: out/r1/coverage-head.lcov
          fail-under-lines: ''
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: pr-paths.yml

      - name: Move R1 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh r1

      # Control for R1: only the recompute is off.
      - name: 'R2. Same, without the recompute'
        id: r2
        uses: ./
        continue-on-error: true
        with:
          base-ref: ${{ steps.history.outputs.base }}
          baseline-ancestor-depth: 0
          report: out/r2/coverage-head.lcov
          fail-under-lines: ''
          recompute-baseline: false
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: pr-paths.yml

      - name: Move R2 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh r2

      # R1 again with `llvm-cov-ignore-filename-regex`, so R1 is its control: only the
      # input differs. `src/ignored.rs` is in both commits and nothing reaches it, so the
      # recompute builds it into R1's baseline, and the head report has it. The filter has
      # to reach the report the recompute builds in the worktree as well as the head's,
      # or the comparison would count the file on one side only. The worktree is a
      # different directory from the workspace, which is why the pattern is a fragment.
      # It is also the second recompute of this job, which finds no worktree of R1's
      # because the action removes its own when it ends (#78): nothing clears it between.
      - name: 'R3. Baseline recomputed with llvm-cov-ignore-filename-regex'
        id: r3
        uses: ./
        continue-on-error: true
        with:
          base-ref: ${{ steps.history.outputs.base }}
          baseline-ancestor-depth: 0
          report: out/r3/coverage-head.lcov
          fail-under-lines: ''
          llvm-cov-ignore-filename-regex: 'src/ignored\.rs$'
          comment: false
          upload-artifacts: false
          publish-baseline: false
          baseline-workflow: pr-paths.yml

      - name: Move R3 outputs aside
        if: ${{ !cancelled() }}
        run: bash tests/move-outputs.sh r3

      - name: Assert every outcome
        if: ${{ !cancelled() }}
        env:
          R1: ${{ steps.r1.outcome }}
          R2: ${{ steps.r2.outcome }}
          R3: ${{ steps.r3.outcome }}
          R1_LINE_PERCENT: ${{ steps.r1.outputs.line-percent }}
          R2_LINE_PERCENT: ${{ steps.r2.outputs.line-percent }}
          VERSION: ${{ steps.r1.outputs.version }}
        run: |
          status=0
          source tests/assert-lib.sh

          maxline() { # <lcov>: the last line with a record
            awk -F'[:,]' '$1 == "DA" && $2 + 0 > m { m = $2 + 0 } END { print m + 0 }' "$1"
          }
          decl_line() { # <source> <function>: the declaration line (not the library's `line_of`)
            grep -n "pub fn $2(" "$1" | head -1 | cut -d: -f1
          }
          # Whether a function's declaration line is covered in an lcov report:
          # covered, uncovered, or missing (no record for it). Only src/lib.rs's records
          # are read: the report has src/ignored.rs too, and a line number means a
          # different line in each file.
          state() { # <lcov> <source> <function>
            awk -F'[:,]' -v line="$(decl_line "$2" "$3")" '
              $1 == "SF" { in_lib = ($2 ~ /\/src\/lib\.rs$/) }
              in_lib && $1 == "DA" && $2 == line { print ($3 > 0 ? "covered" : "uncovered"); found = 1 }
              END { if (!found) print "missing" }' "$1"
          }

          base_src=tests/fixtures/delta-crate/lib.base.rs
          head_src=tests/fixtures/delta-crate/lib.head.rs
          base=out/r1/baseline/coverage-head.lcov
          head=out/r1/coverage-head.lcov

          check "R1. baseline recomputed at the merge-base" success "$R1"
          check "R2. same, without the recompute" success "$R2"
          check "R3. recomputed with llvm-cov-ignore-filename-regex" success "$R3"

          # The recompute wrote the baseline, and wrote it for the base.
          assert "R1: the recompute wrote a baseline" test -s "$base"
          assert "R1: its paths are rewritten to the workspace" \
            grep -qxF "SF:$GITHUB_WORKSPACE/src/lib.rs" "$base"
          assert "R1: none is left under the worktree" \
            test "$(grep -cF "SF:$(dirname "$GITHUB_WORKSPACE")/base/" "$base")" = 0
          # The head has lines the base does not, so only a base build stops short.
          base_lines="$(wc -l < "$base_src")"
          assert "R1: the baseline stops where the base source does" test "$(maxline "$base")" -le "$base_lines"
          assert "R1: the head report goes past it" test "$(maxline "$head")" -gt "$base_lines"
          check "R1: baseline: kept" covered "$(state "$base" "$base_src" kept)"
          check "R1: baseline: flips" uncovered "$(state "$base" "$base_src" flips)"
          check "R1: head: kept" covered "$(state "$head" "$head_src" kept)"
          check "R1: head: flips" covered "$(state "$head" "$head_src" flips)"
          check "R1: head: added_covered" covered "$(state "$head" "$head_src" added_covered)"
          check "R1: head: added_uncovered" uncovered "$(state "$head" "$head_src" added_uncovered)"

          # The diff was rendered from it.
          before="$(bash tests/lcov-percent.sh "$base")"
          after="$(bash tests/lcov-percent.sh "$head")"
          # shellcheck disable=SC2016 # `$v` and `$l` are jq's, not the shell's
          assert "R1: total_before is the baseline's own coverage" \
            jq -e --argjson v "$before" '((.project_delta.total_before - $v) | fabs) < 0.01' out/r1/coverage.json
          # shellcheck disable=SC2016 # `$v` and `$l` are jq's, not the shell's
          assert "R1: total_after is the head report's coverage" \
            jq -e --argjson v "$after" '((.project_delta.total_after - $v) | fabs) < 0.01' out/r1/coverage.json
          assert "R1: the coverage changed" \
            jq -e '.project_delta.total_before != .project_delta.total_after' out/r1/coverage.json
          check "R1: the line-percent output is total_after" \
            "$(jq -r '.project_delta.total_after' out/r1/coverage.json)" "$R1_LINE_PERCENT"
          flips_line="$(decl_line "$head_src" flips)"
          uncovered_new="src/lib.rs:$(decl_line "$head_src" added_uncovered)"
          covered_new="src/lib.rs:$(decl_line "$head_src" added_covered)"
          # shellcheck disable=SC2016 # `$v` and `$l` are jq's, not the shell's
          assert "R1: the unchanged line that flipped is an indirect change" \
            jq -e --arg l "$flips_line" \
              '.indirect_changes.newly_covered >= 1 and ([.indirect_changes.lines[] | select(.path == "src/lib.rs" and (.head_line | tostring) == $l)] | length) == 1' \
              out/r1/coverage.json
          # shellcheck disable=SC2016 # `$v` and `$l` are jq's, not the shell's
          assert "R1: the uncovered new function is listed" \
            jq -e --arg l "$uncovered_new" '.uncovered_new_lines | index($l) != null' out/r1/coverage.json
          # shellcheck disable=SC2016 # `$v` and `$l` are jq's, not the shell's
          assert "R1: the covered new function is not" \
            jq -e --arg l "$covered_new" '.uncovered_new_lines | index($l) == null' out/r1/coverage.json

          # R2 differs from R1 only in the recompute.
          assert "R2: no baseline was found or built" test ! -e out/r2/baseline/coverage-head.lcov
          assert "R2: without a baseline there is no project_delta" \
            jq -e '.project_delta == null' out/r2/coverage.json
          check "R2: the line-percent output is empty without a baseline" "" "$R2_LINE_PERCENT"
          assert "R2: the patch is the same as R1's" \
            test "$(jq -c '.patch_coverage, .uncovered_new_lines' out/r2/coverage.json)" = "$(jq -c '.patch_coverage, .uncovered_new_lines' out/r1/coverage.json)"

          # R3 differs from R1 only in the filter. R1 is the control: the file is in
          # both of its reports, so a filter that did nothing leaves R3 looking like R1.
          base3=out/r3/baseline/coverage-head.lcov
          head3=out/r3/coverage-head.lcov
          ignored_sf='^SF:.*/src/ignored\.rs$'
          assert "R1 (control): the recomputed baseline holds src/ignored.rs" grep -q "$ignored_sf" "$base"
          assert "R1 (control): the head report holds src/ignored.rs" grep -q "$ignored_sf" "$head"
          assert "R3: the recompute wrote a baseline" test -s "$base3"
          assert "R3: the recomputed baseline has no record for src/ignored.rs" \
            test "$(grep -c "$ignored_sf" "$base3")" = 0
          assert "R3: the head report has none either" test "$(grep -c "$ignored_sf" "$head3")" = 0
          # Only the file was dropped, not the rest: the same functions, covered the same way.
          assert "R3: the baseline still has src/lib.rs, at the workspace's path" \
            grep -qxF "SF:$GITHUB_WORKSPACE/src/lib.rs" "$base3"
          for fn in kept flips; do
            check "R3: baseline: $fn is as in R1" "$(state "$base" "$base_src" "$fn")" "$(state "$base3" "$base_src" "$fn")"
          done
          for fn in kept flips added_covered added_uncovered; do
            check "R3: head: $fn is as in R1" "$(state "$head" "$head_src" "$fn")" "$(state "$head3" "$head_src" "$fn")"
          done
          # The diff was rendered from the two filtered reports, and the filter moved the
          # numbers: the file's uncovered lines are out of both totals, so R3's are higher.
          before3="$(bash tests/lcov-percent.sh "$base3")"
          after3="$(bash tests/lcov-percent.sh "$head3")"
          # shellcheck disable=SC2016 # `$v` and `$l` are jq's, not the shell's
          assert "R3: total_before is the filtered baseline's own coverage ($before3)" \
            jq -e --argjson v "$before3" '((.project_delta.total_before - $v) | fabs) < 0.01' out/r3/coverage.json
          # shellcheck disable=SC2016 # `$v` and `$l` are jq's, not the shell's
          assert "R3: total_after is the filtered head report's coverage ($after3)" \
            jq -e --argjson v "$after3" '((.project_delta.total_after - $v) | fabs) < 0.01' out/r3/coverage.json
          assert "R3: the filtered baseline's coverage ($before3) is higher than R1's ($before)" \
            awk -v a="$before" -v b="$before3" 'BEGIN { exit !(a != "" && b != "" && b > a) }'
          assert "R3: the filtered head coverage ($after3) is higher than R1's ($after)" \
            awk -v a="$after" -v b="$after3" 'BEGIN { exit !(a != "" && b != "" && b > a) }'

          bash tests/assert-patchcov-version.sh "$VERSION" || status=1
          exit "$status"
